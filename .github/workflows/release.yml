name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source android-enclosure/version.properties
          expected="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          }

      - name: Restore Android signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret" >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bhakti-mala-release.jks"
          test -s "$RUNNER_TEMP/bhakti-mala-release.jks"

      - name: Build release APK (unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: android-enclosure
        run: ./gradlew --no-daemon assembleRelease

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android-enclosure
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bhakti-mala-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name Android release APK
        shell: bash
        run: |
          source android-enclosure/version.properties
          version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          apk_dir="android-enclosure/app/build/outputs/apk/release"
          if [ -f "$apk_dir/app-release.apk" ]; then
            source_apk="$apk_dir/app-release.apk"
          else
            source_apk="$apk_dir/app-release-unsigned.apk"
          fi
          mv "$source_apk" "$apk_dir/bhakti-mala-${version}-release.apk"

      - name: Verify signed APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source android-enclosure/version.properties
          version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            "android-enclosure/app/build/outputs/apk/release/bhakti-mala-${version}-release.apk"

      - name: Remove Android signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/bhakti-mala-release.jks"

      - name: Package web app
        shell: bash
        run: |
          source android-enclosure/version.properties
          version="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          zip -r "bhakti-mala-webapp-${version}.zip" bhakti-mala-android

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bhakti-mala-${{ github.ref_name }}
          path: |
            android-enclosure/app/build/outputs/apk/release/bhakti-mala-*-release.apk
            bhakti-mala-webapp-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android-enclosure/app/build/outputs/apk/release/bhakti-mala-*-release.apk
            bhakti-mala-webapp-*.zip
